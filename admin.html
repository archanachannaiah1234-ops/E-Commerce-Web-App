<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>

*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial;
    background:#f2f4f7;
}

nav{
    background:#18202b;
    color:white;
    padding:18px 5%;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
}

.container{
    width:92%;
    max-width:1200px;
    margin:30px auto;
}

.panel{
    background:white;
    padding:25px;
    border-radius:12px;
    margin-bottom:30px;
    box-shadow:0 3px 12px #0002;
}

input,textarea,select{
    width:100%;
    padding:11px;
    margin:7px 0 15px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    padding:10px 15px;
    border:0;
    border-radius:6px;
    cursor:pointer;
    background:#18202b;
    color:white;
    margin:4px;
}

button.delete{
    background:#b3261e;
}

button.edit{
    background:#555;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.product{
    background:#fff;
    border-radius:10px;
    padding:15px;
    box-shadow:0 3px 10px #0002;
}

.product img{
    width:100%;
    height:170px;
    object-fit:contain;
}

.order{
    border:1px solid #ddd;
    padding:20px;
    border-radius:10px;
    margin:15px 0;
}

.status{
    font-weight:bold;
}

#message{
    font-weight:bold;
    margin:10px 0;
}

</style>
</head>

<body>

<nav>

<h2>⚙️ Admin Dashboard</h2>

<div>

<a href="index.html">Store</a>

<a href="orders.html">My Orders</a>

<a href="login.html" onclick="logout()">Logout</a>

</div>

</nav>

<div class="container">

<div id="message"></div>

<!-- PRODUCT FORM -->

<section class="panel">

<h2>➕ Add Product</h2>

<form id="productForm">

<label>Product Name</label>

<input
    type="text"
    id="productName"
    required
>

<label>Price</label>

<input
    type="number"
    id="productPrice"
    required
>

<label>Image Path</label>

<input
    type="text"
    id="productImage"
    placeholder="image/product.jpg"
>

<label>Category</label>

<select id="productCategory">

<option value="Electronics">
Electronics
</option>

<option value="Accessories">
Accessories
</option>

</select>

<label>Description</label>

<textarea id="productDescription"></textarea>

<label>Rating</label>

<input
    type="number"
    id="productRating"
    value="4.5"
    min="0"
    max="5"
    step="0.1"
>

<button type="submit">
    Add Product
</button>

</form>

</section>


<!-- PRODUCT MANAGEMENT -->

<section class="panel">

<h2>🛍️ Product Management</h2>

<div id="products" class="products">
Loading products...
</div>

</section>


<!-- ORDER MANAGEMENT -->

<section class="panel">

<h2>📦 Order Management</h2>

<div id="orders">
Loading orders...
</div>

</section>

</div>

<script>

const API="https://ecommerce-backend-1-ned8.onrender.com/api";

const token=localStorage.getItem("token");

if(!token){

    alert("Admin login required.");

    window.location.href="login.html";
}


/* =========================
   PRODUCTS
========================= */

async function loadProducts(){

    try{

        const response=await fetch(API+"/products");

        const data=await response.json();

        const products=
            Array.isArray(data)
            ? data
            : data.products || [];

        if(products.length===0){

            document.getElementById("products").innerHTML=
                "<p>No products found.</p>";

            return;
        }

        document.getElementById("products").innerHTML=

        products.map(product=>`

        <div class="product">

            <img
                src="${product.image || "image/product.jpg"}"
                onerror="this.src='image/product.jpg'"
            >

            <h3>${product.name}</h3>

            <p>
                ${product.description || ""}
            </p>

            <h3>
                ₹${product.price}
            </h3>

            <p>
                Category: ${product.category || "N/A"}
            </p>

            <button
                class="edit"
                onclick='editProduct(${JSON.stringify(product)})'
            >
                ✏️ Edit
            </button>

            <button
                class="delete"
                onclick="deleteProduct('${product._id}')"
            >
                🗑️ Delete
            </button>

        </div>

        `).join("");

    }catch(error){

        console.log(error);

        document.getElementById("products").innerHTML=
            "<p>Could not load products.</p>";
    }
}


/* =========================
   ADD PRODUCT
========================= */

document.getElementById("productForm")
.addEventListener("submit",async function(e){

    e.preventDefault();

    const product={

        name:document.getElementById("productName").value,

        price:Number(
            document.getElementById("productPrice").value
        ),

        image:document.getElementById("productImage").value,

        category:document.getElementById("productCategory").value,

        description:
            document.getElementById("productDescription").value,

        rating:Number(
            document.getElementById("productRating").value
        )
    };

    try{

        const response=await fetch(
            API+"/products",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json",
                    "Authorization":"Bearer "+token
                },

                body:JSON.stringify(product)
            }
        );

        const data=await response.json();

        if(!response.ok){

            alert(data.message || "Could not add product.");
            return;
        }

        alert("Product added successfully! ✅");

        document.getElementById("productForm").reset();

        loadProducts();

    }catch(error){

        console.log(error);

        alert("Server error.");
    }

});


/* =========================
   DELETE PRODUCT
========================= */

async function deleteProduct(id){

    if(!confirm("Delete this product?")){
        return;
    }

    try{

        const response=await fetch(
            API+"/products/"+id,
            {
                method:"DELETE",

                headers:{
                    "Authorization":"Bearer "+token
                }
            }
        );

        const data=await response.json();

        if(!response.ok){

            alert(data.message || "Delete failed.");
            return;
        }

        alert("Product deleted.");

        loadProducts();

    }catch(error){

        console.log(error);

        alert("Server error.");
    }
}


/* =========================
   EDIT PRODUCT
========================= */

async function editProduct(product){

    const name=prompt(
        "Product name:",
        product.name
    );

    if(name===null)return;

    const price=prompt(
        "Price:",
        product.price
    );

    if(price===null)return;

    const description=prompt(
        "Description:",
        product.description || ""
    );

    const updated={

        name:name,

        price:Number(price),

        image:product.image,

        category:product.category,

        description:description,

        rating:product.rating || 4.5
    };

    try{

        const response=await fetch(
            API+"/products/"+product._id,
            {
                method:"PUT",

                headers:{
                    "Content-Type":"application/json",
                    "Authorization":"Bearer "+token
                },

                body:JSON.stringify(updated)
            }
        );

        const data=await response.json();

        if(!response.ok){

            alert(data.message || "Update failed.");
            return;
        }

        alert("Product updated! ✅");

        loadProducts();

    }catch(error){

        console.log(error);

        alert("Server error.");
    }
}


/* =========================
   ORDERS
========================= */

async function loadOrders(){

    try{

        const response=await fetch(
            API+"/orders",
            {
                headers:{
                    "Authorization":"Bearer "+token
                }
            }
        );

        const data=await response.json();

        const orders=
            Array.isArray(data)
            ? data
            : data.orders || [];

        if(orders.length===0){

            document.getElementById("orders").innerHTML=
                "<h3>No orders yet.</h3>";

            return;
        }

        document.getElementById("orders").innerHTML=

        orders.map((order,index)=>{

            const items=order.items || [];

            return `

            <div class="order">

                <h3>
                    📦 Order #${index+1}
                </h3>

                <p>
                    <strong>Order ID:</strong>
                    ${order._id || "N/A"}
                </p>

                <p>
                    <strong>Customer:</strong>
                    ${order.customerName || "N/A"}
                </p>

                <p>
                    <strong>Address:</strong>
                    ${order.address || "N/A"}
                </p>

                <p>
                    <strong>Phone:</strong>
                    ${order.phone || "N/A"}
                </p>

                <p>
                    <strong>Status:</strong>
                    <span class="status">
                        ${order.status || "Pending"}
                    </span>
                </p>

                <h4>Products:</h4>

                ${
                    items.map(item=>`

                    <p>
                        ${item.name || item.productName}
                        -
                        ₹${item.price || 0}
                        ×
                        ${item.quantity || 1}
                    </p>

                    `).join("")
                }

                <h3>
                    Total:
                    ₹${order.total || order.totalAmount || 0}
                </h3>

                <select
                    id="status-${order._id}"
                >

                    <option value="Pending">
                        Pending
                    </option>

                    <option value="Processing">
                        Processing
                    </option>

                    <option value="Shipped">
                        Shipped
                    </option>

                    <option value="Delivered">
                        Delivered
                    </option>

                    <option value="Cancelled">
                        Cancelled
                    </option>

                </select>

                <button
                    onclick="updateOrderStatus('${order._id}')"
                >
                    Update Status
                </button>

            </div>

            `;

        }).join("");

    }catch(error){

        console.log(error);

        document.getElementById("orders").innerHTML=
            "<p>Could not load orders.</p>";
    }
}


/* =========================
   UPDATE ORDER STATUS
========================= */

async function updateOrderStatus(id){

    const status=
        document.getElementById("status-"+id).value;

    try{

        const response=await fetch(
            API+"/orders/"+id+"/status",
            {
                method:"PUT",

                headers:{
                    "Content-Type":"application/json",
                    "Authorization":"Bearer "+token
                },

                body:JSON.stringify({
                    status:status
                })
            }
        );

        const data=await response.json();

        if(!response.ok){

            alert(data.message || "Status update failed.");
            return;
        }

        alert("Order status updated! ✅");

        loadOrders();

    }catch(error){

        console.log(error);

        alert("Server error.");
    }
}


function logout(){

    localStorage.removeItem("token");
    localStorage.removeItem("user");
}


loadProducts();
loadOrders();

</script>

</body>
</html>
