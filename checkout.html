<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<nav>

    <h2>🛍️ My Online Store</h2>

    <div>

        <a href="index.html">
            Home
        </a>

        <a href="index.html#products">
            Products
        </a>

        <a href="cart.html">
            Cart
        </a>

        <a href="orders.html">
            Orders
        </a>

        <a href="login.html">
            Login
        </a>

    </div>

</nav>


<section class="checkout-section">

    <h1>🧾 Checkout</h1>


    <div class="checkout-box">

        <h2>
            Delivery Details
        </h2>


        <form id="checkout-form">


            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                required
            >


            <label for="address">
                Address
            </label>

            <textarea
                id="address"
                required
            ></textarea>


            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                required
            >


            <h2 id="checkout-total">
                Total: ₹0
            </h2>


            <button type="submit">
                Place Order
            </button>


        </form>


        <p id="checkout-message"></p>


    </div>

</section>


<script>


const API =
    "http://localhost:5000/api";


/*
========================================
CHECK LOGIN
========================================
*/

const token =
    localStorage.getItem("token");


if (!token) {

    alert(
        "Please login before checkout."
    );

    window.location.href =
        "login.html";

}


/*
========================================
GET CART
========================================
*/

let cart =
    JSON.parse(
        localStorage.getItem("cart")
    ) || [];


if (!Array.isArray(cart)) {

    cart = [];

}


/*
========================================
CALCULATE TOTAL
========================================
*/

let total = 0;


cart.forEach(
    item => {

        const price =
            Number(
                item.price || 0
            );

        const quantity =
            Number(
                item.quantity || 1
            );

        total +=
            price * quantity;

    }
);


document.getElementById(
    "checkout-total"
).textContent =
    "Total: ₹" +
    total.toLocaleString("en-IN");


/*
========================================
CHECK EMPTY CART
========================================
*/

if (cart.length === 0) {

    document.getElementById(
        "checkout-message"
    ).textContent =
        "Your cart is empty.";

}


/*
========================================
PLACE ORDER
========================================
*/

document
    .getElementById(
        "checkout-form"
    )
    .addEventListener(
        "submit",
        async function(event) {


            event.preventDefault();


            if (cart.length === 0) {

                alert(
                    "Your cart is empty."
                );

                return;

            }


            const name =
                document.getElementById(
                    "name"
                ).value.trim();


            const address =
                document.getElementById(
                    "address"
                ).value.trim();


            const phone =
                document.getElementById(
                    "phone"
                ).value.trim();


            /*
            Convert cart to order products
            */

            const products =
                cart.map(
                    item => ({

                        name:
                            item.name,

                        price:
                            Number(
                                item.price
                            ),

                        quantity:
                            Number(
                                item.quantity ||
                                1
                            )

                    })
                );


            const orderData = {

                products:
                    products,

                total:
                    total,

                deliveryDetails: {

                    name:
                        name,

                    address:
                        address,

                    phone:
                        phone

                }

            };


            try {


                document.getElementById(
                    "checkout-message"
                ).textContent =
                    "Placing order...";


                /*
                Send order to MongoDB
                */

                const response =
                    await fetch(

                        `${API}/orders`,

                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    `Bearer ${token}`

                            },

                            body:
                                JSON.stringify(
                                    orderData
                                )

                        }

                    );


                const data =
                    await response.json();


                /*
                Check server response
                */

                if (!response.ok) {

                    document.getElementById(
                        "checkout-message"
                    ).textContent =
                        data.message ||
                        "Order failed.";

                    return;

                }


                /*
                Clear cart
                */

                localStorage.removeItem(
                    "cart"
                );


                /*
                Save order temporarily
                for success page
                */

                localStorage.setItem(

                    "lastOrder",

                    JSON.stringify(data)

                );


                /*
                Go to success page
                */

                window.location.href =
                    "order-success.html";


            } catch (error) {


                console.error(
                    "Checkout error:",
                    error
                );


                document.getElementById(
                    "checkout-message"
                ).textContent =
                    "Cannot connect to server. Make sure backend is running.";


            }

        }
    );


</script>


</body>

</html>
