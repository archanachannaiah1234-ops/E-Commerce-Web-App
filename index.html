<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Online Store</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    color:#222;
}
nav{
    background:#18202b;
    color:white;
    padding:18px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
}
nav h2{margin:0}
nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
}
nav a:hover{text-decoration:underline}

.hero{
    text-align:center;
    padding:45px 20px;
    background:white;
}
.hero h1{font-size:36px}

.search{
    display:flex;
    justify-content:center;
    gap:10px;
    padding:25px;
}
.search input,.search select{
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
}

.products{
    padding:20px 6%;
}
.product-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:25px;
}
.card{
    background:white;
    padding:18px;
    border-radius:12px;
    box-shadow:0 3px 12px #0002;
}
.card img{
    width:100%;
    height:190px;
    object-fit:contain;
    border-radius:8px;
}
.card h3{font-size:21px}
.price{
    font-size:20px;
    font-weight:bold;
}
button{
    border:0;
    padding:11px 15px;
    border-radius:6px;
    cursor:pointer;
    margin:5px 3px;
    background:#18202b;
    color:white;
}
button:hover{opacity:.85}

#cart{
    background:white;
    margin:30px 6%;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 12px #0002;
}

.cart-item{
    border-bottom:1px solid #ddd;
    padding:12px 0;
}

.checkout{
    display:none;
    background:white;
    margin:30px 6%;
    padding:25px;
    border-radius:12px;
}
.checkout input,.checkout textarea{
    width:100%;
    padding:12px;
    margin:8px 0 15px;
    border:1px solid #ccc;
    border-radius:6px;
}

.message{
    text-align:center;
    padding:15px;
    font-weight:bold;
}
</style>
</head>

<body>

<nav>
    <h2>🛍️ My Online Store</h2>

    <div>
        <a href="index.html">Home</a>
        <a href="#products">Products</a>
        <a href="#cart">Cart 🛒 (<span id="cartCount">0</span>)</a>
        <a href="orders.html">My Orders</a>
        <a href="login.html">Login</a>
    </div>
</nav>

<section class="hero">
    <h1>Welcome to Our Online Store</h1>
    <p>Shop electronics and accessories easily.</p>
</section>

<div class="search">
    <input id="search" type="text" placeholder="🔎 Search products">
    
    <select id="category">
        <option value="all">All Products</option>
        <option value="Electronics">Electronics</option>
        <option value="Accessories">Accessories</option>
    </select>
</div>

<div id="message" class="message"></div>

<section class="products" id="products">
    <h2>🛍️ Product Catalog</h2>

    <div id="productsContainer" class="product-container">
        Loading products...
    </div>
</section>

<section id="cart">
    <h2>🛒 Shopping Cart</h2>

    <div id="cartItems">
        Cart is empty.
    </div>

    <h2>Total: ₹<span id="cartTotal">0</span></h2>

    <button onclick="showCheckout()">Proceed to Checkout</button>
</section>

<section id="checkout" class="checkout">

    <h2>🧾 Checkout</h2>

    <label>Full Name</label>
    <input id="customerName" type="text" required>

    <label>Address</label>
    <textarea id="address" required></textarea>

    <label>Phone Number</label>
    <input id="phone" type="tel" required>

    <h3>Total: ₹<span id="checkoutTotal">0</span></h3>

    <button onclick="placeOrder()">Place Order</button>
</section>

<script>

const API = "http://localhost:5000/api";

let products = [];
let cart = JSON.parse(localStorage.getItem("cart")) || [];

async function loadProducts(){

    try{

        const response = await fetch(API + "/products");

        if(!response.ok){
            throw new Error("Could not load products");
        }

        products = await response.json();

        displayProducts();

    }catch(error){

        document.getElementById("productsContainer").innerHTML =
            "<p>Unable to load products. Make sure backend is running.</p>";

        console.log(error);
    }
}

function displayProducts(){

    const container = document.getElementById("productsContainer");

    const searchText =
        document.getElementById("search").value.toLowerCase();

    const category =
        document.getElementById("category").value;

    const filtered = products.filter(p => {

        const matchesSearch =
            (p.name || "").toLowerCase().includes(searchText);

        const matchesCategory =
            category === "all" ||
            (p.category || "").toLowerCase() === category.toLowerCase();

        return matchesSearch && matchesCategory;
    });

    if(filtered.length === 0){
        container.innerHTML = "<p>No products found.</p>";
        return;
    }

    container.innerHTML = filtered.map(p => {

        const image = p.image
            ? p.image
            : "image/smartphone.jpg";

        return `
        <div class="card">

            <img src="${image}" alt="${p.name}"
                 onerror="this.src='image/smartphone.jpg'">

            <h3>${p.name}</h3>

            <p>${p.description || "Quality product."}</p>

            <p>⭐ ${p.rating || 4.5}</p>

            <div class="price">₹${p.price}</div>

            <button onclick='addToCart(${JSON.stringify(p)})'>
                🛒 Add to Cart
            </button>

        </div>
        `;

    }).join("");
}

function addToCart(product){

    const existing = cart.find(item => item._id === product._id);

    if(existing){
        existing.quantity++;
    }else{
        cart.push({
            _id:product._id,
            name:product.name,
            price:Number(product.price),
            image:product.image,
            quantity:1
        });
    }

    saveCart();

    document.getElementById("message").innerText =
        product.name + " added to cart ✅";

    setTimeout(()=>{
        document.getElementById("message").innerText="";
    },2000);
}

function saveCart(){

    localStorage.setItem("cart",JSON.stringify(cart));

    displayCart();
}

function displayCart(){

    const container = document.getElementById("cartItems");

    let total = 0;
    let count = 0;

    if(cart.length === 0){

        container.innerHTML = "Cart is empty.";

    }else{

        container.innerHTML = cart.map((item,index)=>{

            total += item.price * item.quantity;
            count += item.quantity;

            return `
            <div class="cart-item">

                <strong>${item.name}</strong>

                <p>
                    ₹${item.price} × ${item.quantity}
                </p>

                <button onclick="decrease(${index})">−</button>

                <button onclick="increase(${index})">+</button>

                <button onclick="removeItem(${index})">
                    Remove
                </button>

            </div>
            `;

        }).join("");
    }

    document.getElementById("cartTotal").innerText = total;
    document.getElementById("cartCount").innerText = count;
    document.getElementById("checkoutTotal").innerText = total;
}

function increase(index){
    cart[index].quantity++;
    saveCart();
}

function decrease(index){

    cart[index].quantity--;

    if(cart[index].quantity <= 0){
        cart.splice(index,1);
    }

    saveCart();
}

function removeItem(index){

    cart.splice(index,1);
    saveCart();
}

function showCheckout(){

    if(cart.length === 0){
        alert("Your cart is empty.");
        return;
    }

    document.getElementById("checkout").style.display="block";

    window.scrollTo({
        top:document.getElementById("checkout").offsetTop,
        behavior:"smooth"
    });
}

async function placeOrder(){

    const token = localStorage.getItem("token");

    if(!token){

        alert("Please login before placing an order.");
        window.location.href="login.html";
        return;
    }

    const customerName =
        document.getElementById("customerName").value.trim();

    const address =
        document.getElementById("address").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    if(!customerName || !address || !phone){

        alert("Please fill all delivery details.");
        return;
    }

    const total = cart.reduce(
        (sum,item)=>sum + item.price * item.quantity,
        0
    );

    const orderData = {

        items:cart,

        total:total,

        customerName:customerName,

        address:address,

        phone:phone
    };

    try{

        const response = await fetch(API + "/orders",{

            method:"POST",

            headers:{
                "Content-Type":"application/json",
                "Authorization":"Bearer " + token
            },

            body:JSON.stringify(orderData)
        });

        const data = await response.json();

        if(!response.ok){

            alert(data.message || "Order failed.");
            return;
        }

        localStorage.removeItem("cart");
        cart=[];

        alert("Order placed successfully! ✅");

        window.location.href="orders.html";

    }catch(error){

        console.log(error);

        alert("Server error. Check backend.");
    }
}

document.getElementById("search")
.addEventListener("input",displayProducts);

document.getElementById("category")
.addEventListener("change",displayProducts);

displayCart();
loadProducts();

</script>

</body>
</html>
