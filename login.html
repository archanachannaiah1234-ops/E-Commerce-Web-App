<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f2f4f7;
}
.box{
    width:350px;
    max-width:90%;
    margin:80px auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 15px #0002;
}
h1{text-align:center}
input{
    width:100%;
    padding:12px;
    margin:8px 0 15px;
    box-sizing:border-box;
}
button{
    width:100%;
    padding:12px;
    background:#18202b;
    color:white;
    border:0;
    border-radius:6px;
    cursor:pointer;
}
a{
    display:block;
    text-align:center;
    margin-top:15px;
}
#message{
    text-align:center;
    margin:10px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="box">

<h1>🔐 Login</h1>

<div id="message"></div>

<form id="loginForm">

<label>Email</label>

<input
    type="email"
    id="email"
    required
>

<label>Password</label>

<input
    type="password"
    id="password"
    required
>

<button type="submit">
    Login
</button>

</form>

<a href="register.html">
    Create new account
</a>

<a href="index.html">
    Back to Store
</a>

</div>

<script>

const API="http://localhost:5000/api";

document.getElementById("loginForm")
.addEventListener("submit",async function(e){

    e.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    try{

        const response = await fetch(API+"/auth/login",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                email:email,
                password:password
            })
        });

        const data=await response.json();

        if(!response.ok){

            message.innerText =
                data.message || "Login failed.";

            return;
        }

        const token =
            data.token || data.accessToken;

        if(token){
            localStorage.setItem("token",token);
        }

        const user =
            data.user || data;

        localStorage.setItem(
            "user",
            JSON.stringify(user)
        );

        const role =
            user.role ||
            data.role ||
            "user";

        if(role.toLowerCase()==="admin"){

            window.location.href="admin.html";

        }else{

            window.location.href="index.html";
        }

    }catch(error){

        console.log(error);

        message.innerText =
            "Cannot connect to backend.";
    }

});

</script>

</body>
</html>
