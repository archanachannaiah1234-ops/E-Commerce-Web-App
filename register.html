<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f2f4f7;
}
.box{
    width:380px;
    max-width:90%;
    margin:50px auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 15px #0002;
}
h1{text-align:center}
input{
    width:100%;
    padding:12px;
    margin:8px 0 15px;
    box-sizing:border-box;
}
button{
    width:100%;
    padding:12px;
    background:#18202b;
    color:white;
    border:0;
    border-radius:6px;
}
a{
    display:block;
    text-align:center;
    margin-top:15px;
}
#message{
    text-align:center;
    margin:10px;
}
</style>
</head>

<body>

<div class="box">

<h1>📝 Register</h1>

<div id="message"></div>

<form id="registerForm">

<label>Full Name</label>

<input
    type="text"
    id="name"
    required
>

<label>Email</label>

<input
    type="email"
    id="email"
    required
>

<label>Password</label>

<input
    type="password"
    id="password"
    minlength="6"
    required
>

<button type="submit">
    Create Account
</button>

</form>

<a href="login.html">
    Already have an account? Login
</a>

</div>

<script>

const API="https://ecommerce-backend-1-ned8.onrender.com/api";

document.getElementById("registerForm")
.addEventListener("submit",async function(e){

    e.preventDefault();

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    try{

        const response = await fetch(
            API+"/auth/register",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    name:name,
                    email:email,
                    password:password
                })
            }
        );

        const data=await response.json();

        if(!response.ok){

            message.innerText =
                data.message || "Registration failed.";

            return;
        }

        message.innerText =
            "Registration successful! ✅";

        setTimeout(()=>{

            window.location.href="login.html";

        },1000);

    }catch(error){

        console.log(error);

        message.innerText =
            "Cannot connect to backend.";
    }

});

</script>

</body>
</html>
